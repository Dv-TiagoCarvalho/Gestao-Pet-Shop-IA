<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Gestão Pet Shop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho da loja + faixa de abas fixa; cada aba é uma folha de trabalho com o resumo no topo e a lista operável abaixo */
:root{
  --bg:#F2F5EF; --surface:#FFFFFF; --sunken:#E7ECE3; --ink:#17251D; --muted:#56665C; --line:#D3DBD0;
  --accent:#1E6B47; --accent-ink:#FFFFFF; --accent-soft:#DCECE1; --ball:#D6E548; --ball-ink:#2A3305;
  --ok:#1B7745; --ok-soft:#DCEFE2; --warn:#8A5800; --warn-soft:#F7E9C8; --crit:#AE3328; --crit-soft:#F7DDD9; --info:#27589C; --info-soft:#DBE7F6;
  --shadow:0 1px 2px rgba(23,37,29,.06),0 8px 24px rgba(23,37,29,.08);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101812; --surface:#18231C; --sunken:#0B120D; --ink:#E6EEE8; --muted:#9AAA9F; --line:#2C3B31;
    --accent:#63C992; --accent-ink:#0B1F14; --accent-soft:#1D3528; --ball:#D6E548; --ball-ink:#2A3305;
    --ok:#73D49E; --ok-soft:#173424; --warn:#E8B95A; --warn-soft:#3A2D10; --crit:#F0877C; --crit-soft:#40201C; --info:#8DB6EE; --info-soft:#1A2B44;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101812; --surface:#18231C; --sunken:#0B120D; --ink:#E6EEE8; --muted:#9AAA9F; --line:#2C3B31;
  --accent:#63C992; --accent-ink:#0B1F14; --accent-soft:#1D3528; --ball:#D6E548; --ball-ink:#2A3305;
  --ok:#73D49E; --ok-soft:#173424; --warn:#E8B95A; --warn-soft:#3A2D10; --crit:#F0877C; --crit-soft:#40201C; --info:#8DB6EE; --info-soft:#1A2B44;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:18px 96px;display:flex;flex-direction:column;gap:18px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.grow{flex:1 1 auto;min-width:0}

/* cabeçalho */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px}
.top h1{font-size:clamp(24px,5vw,34px);font-weight:700;letter-spacing:-.02em}
.top .sub{color:var(--muted);font-size:13px}
.top .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs div{display:flex;gap:4px;min-width:max-content}
.tab{background:none;border:0;padding:12px 12px 10px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* blocos */
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.sec-h h2{font-size:19px;font-weight:700}
.sec-h .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px}
@media (max-width:780px){.cols{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:780px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.1}
.stat .d{font-size:13px;color:var(--muted)}
.stat.alert .v{color:var(--crit)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);min-width:0}
.row .main{flex:1 1 220px;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row.click{cursor:pointer}
.row.click:hover{background:var(--sunken)}
.hora{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;width:58px;flex:none}
.hora small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.03em;border:1px dashed var(--muted);color:var(--muted);vertical-align:middle}
.empty{padding:22px 14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.note{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.note.plain{background:var(--accent-soft)}

/* agenda */
.datebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 2px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:1px;align-items:center;min-width:0}
.day .w{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.day .n{font-family:var(--display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.day .c{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.sel{border-color:var(--accent);background:var(--accent-soft)}
.day.hoje .n{background:var(--ball);color:var(--ball-ink);border-radius:6px;padding:0 6px}

/* formulários */
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
.field input,.field select,.field textarea,.inp{font-weight:400;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
.field textarea{min-height:64px;resize:vertical}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:460px){.f3{grid-template-columns:repeat(2,minmax(0,1fr))}}
fieldset{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0;min-width:0}
legend{font-size:13px;font-weight:600;padding:0 4px}
.check{display:flex;gap:8px;align-items:center;padding:5px 0;font-weight:400;font-size:14px}
.check span{flex:1 1 auto;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-weight:600;font-size:14px}
.seg input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.erro{color:var(--crit);font-weight:600;font-size:14px}
.search{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search .inp{flex:1 1 200px}

/* tabela */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

/* caixa */
.cart-line{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{background:var(--surface);border:0;width:30px;height:30px;cursor:pointer;font-weight:700}
.qty span{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--display);font-weight:700;font-size:24px}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line);padding-top:6px}
.bar{flex:1 1 0;min-width:0;background:var(--accent);border-radius:3px 3px 0 0;min-height:0}
.bar.zero{background:var(--line);height:2px}
.bar.sel{background:var(--ball)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}

/* portal do cliente */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.slot{border:1px solid var(--line);border-radius:8px;padding:7px 4px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;background:var(--surface)}
.daysel{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.daysel .day{flex:0 0 66px}
.fone{font-family:var(--display);font-size:22px;font-weight:700;user-select:all;font-variant-numeric:tabular-nums}

/* diálogo e aviso */
dialog{border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--ink);width:min(540px,calc(100vw - 24px));max-height:calc(100% - 24px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,18,13,.5)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
dialog header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
dialog header h2{font-size:19px;flex:1 1 auto}
dialog .x{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.dlg-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
dialog footer{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:calc(100vw - 32px);box-shadow:var(--shadow);z-index:50}
@media (prefers-reduced-motion:no-preference){.bar{transition:height .25s ease}}
</style>
<script src="dados-locais.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top" id="top">
    <div>
      <h1 id="loja">Gestão Pet Shop</h1>
      <p class="sub" id="sub">Conectando aos dados da loja…</p>
    </div>
    <div class="acts" id="top-acts"></div>
  </header>
  <nav class="tabs" id="nav" aria-label="Seções" hidden><div id="nav-in"></div></nav>
  <main id="view" class="sec">
    <div class="empty"><strong>Abrindo a loja…</strong><span>A agenda, os clientes, o estoque e o caixa aparecem aqui assim que os dados carregarem.</span></div>
  </main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
var DIAS=['dom','seg','ter','qua','qui','sex','sáb'];
var STATUS={agendado:['Agendado','info'],atendimento:['Em atendimento','warn'],concluido:['Concluído','ok'],faltou:['Faltou','crit'],cancelado:['Cancelado','']};
var PAG={pix:'Pix',dinheiro:'Dinheiro',debito:'Débito',credito:'Crédito'};
var ESPECIES=['Cachorro','Gato','Ave','Roedor','Outro'];
var PORTES=['P','M','G','GG'];
var CFG0={nome:'Meu Pet Shop',telefone:'',endereco:'',abre:'08:00',fecha:'18:00',dias:[1,2,3,4,5,6],capacidade:2};
var TABS=[['hoje','Hoje'],['agenda','Agenda'],['clientes','Clientes e pets'],['estoque','Estoque'],['caixa','Vendas e caixa'],['ajustes','Ajustes']];

var $=function(s,r){return (r||document).querySelector(s)};
var view=$('#view'), dlg=$('#dlg'), toastEl=$('#toast');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ymd(new Date())}
function parseYmd(s){var p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(s,n){var d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)}
function ym(s){return String(s).slice(0,7)}
function addMonths(m,n){var p=m.split('-').map(Number);var d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function fmtLongo(s){return parseYmd(s).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}
function fmtCurto(s){var d=parseYmd(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)}
function fmtMes(m){var s=parseYmd(m+'-01').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return s}
function toMin(h){var p=String(h||'0:0').split(':').map(Number);return (p[0]||0)*60+(p[1]||0)}
function fromMin(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes()}
function brl(c){return ((Number(c)||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function brlIn(c){return ((Number(c)||0)/100).toFixed(2).replace('.',',')}
function parseBRL(str){var s=String(str==null?'':str).trim().replace(/[R$\s]/g,'');if(!s)return 0;if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');var n=Number(s);return (isFinite(n)&&n>=0)?Math.round(n*100):NaN}
function sum(a,f){return a.reduce(function(t,x){return t+(Number(f(x))||0)},0)}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
function byNome(a,b){return norm(a.nome).localeCompare(norm(b.nome))}
function plural(n,um,varios){return n+' '+(n===1?um:varios)}

var S={ready:false,db:null,semDb:false,staff:false,previa:false,tab:'hoje',aviso:'',
  cfg:Object.assign({},CFG0),servicos:[],clientes:[],pets:[],produtos:[],agenda:{},caixa:{},ocup:{},
  dia:today(),caixaDia:today(),busca:{clientes:'',estoque:''},soBaixo:false,clienteAberto:null,hist:{},
  pdv:{sel:'',qtd:'1'},carrinho:novoCarrinho(),portal:{servicoId:'',dia:today()}};
function novoCarrinho(){return {itens:[],clienteId:'',descTxt:'',pagamento:'pix',agendamentoId:null,agMes:null}}
try{var h=(location.hash||'').slice(1);var salvo=localStorage.getItem('petshop.tab');var t0=h||salvo;if(TABS.some(function(t){return t[0]===t0}))S.tab=t0}catch(e){}

/* ---------- consultas ---------- */
function cli(id){return S.clientes.find(function(c){return c.id===id})}
function pet(id){return S.pets.find(function(p){return p.id===id})}
function petsDe(id){return S.pets.filter(function(p){return p.clienteId===id}).sort(byNome)}
function agDe(d){return (S.agenda[ym(d)]||[]).filter(function(a){return a.data===d}).sort(function(a,b){return toMin(a.hora)-toMin(b.hora)})}
function vdDe(d){return (S.caixa[ym(d)]||[]).filter(function(v){return v.data===d}).sort(function(a,b){return String(b.hora).localeCompare(String(a.hora))})}
function nomesServ(a){return (a.servicos||[]).map(function(s){return s.nome}).join(' + ')||'Serviço'}
function valorServ(a){return sum(a.servicos||[],function(s){return s.preco})}
function baixos(){return S.produtos.filter(function(p){return (Number(p.qtd)||0)<=(Number(p.minimo)||0)}).sort(byNome)}
function slotsDe(a){var ini=Math.floor(toMin(a.hora)/30)*30;var fim=Math.ceil((toMin(a.hora)+(Number(a.duracao)||30))/30)*30;var o=[];for(var t=ini;t<fim;t+=30)o.push(fromMin(t));return o}

/* ---------- dados ---------- */
var subs={};
function sub(key,q,fn){if(subs[key])return;subs[key]=q.onSnapshot(fn,function(e){delete subs[key];if(e&&e.code==='revoked'){S.aviso='Seu acesso a esta página mudou. Recarregue para continuar.';render()}})}
function unsub(key){if(subs[key]){try{subs[key]()}catch(e){}delete subs[key]}}
function rows(snap){return snap.docs.map(function(d){return Object.assign({id:d.id},d.data())})}
function ensureMonths(){
  if(!S.db||!S.staff)return;
  var ws=inicioSemana(S.dia);
  var need={};
  [ym(today()),ym(S.dia),ym(ws),ym(addDays(ws,6))].forEach(function(m){need['agenda:'+m]=1});
  [ym(today()),ym(S.caixaDia)].forEach(function(m){need['caixa:'+m]=1});
  Object.keys(subs).forEach(function(k){if((k.indexOf('agenda:')===0||k.indexOf('caixa:')===0)&&!need[k])unsub(k)});
  Object.keys(need).forEach(function(k){
    if(subs[k])return;var p=k.split(':'),kind=p[0],m=p[1];
    var col=kind==='agenda'?S.db.collection('agenda/'+m+'/itens'):S.db.collection('caixa/'+m+'/vendas');
    sub(k,col,function(snap){S[kind][m]=rows(snap);render()});
  });
}
function inicioSemana(d){var dt=parseYmd(d);return addDays(d,-((dt.getDay()+6)%7))}
function dbMsg(e){
  var c=e&&e.code;
  if(c==='quota_exceeded')return 'O banco de dados desta página está cheio. Apague registros antigos e tente de novo.';
  if(c==='invalid_argument')return 'Não foi possível salvar: seu acesso não permite alterar estes dados.';
  if(c==='resource_exhausted')return 'Muitas operações seguidas. Aguarde um instante e tente de novo.';
  if(c==='revoked'||c==='not_granted')return 'Seu acesso a esta página mudou. Recarregue para continuar.';
  return 'Não foi possível salvar agora. Confira a conexão e tente de novo.';
}
var ocupado=false;
async function fazer(fn,okMsg){
  if(ocupado)return false;ocupado=true;
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){console.error(e);toast(dbMsg(e));return false}
  finally{ocupado=false;render()}
}
async function syncOcupacao(date,mudou){
  var list=agDe(date).filter(function(a){return !mudou||a.id!==mudou.id});
  if(mudou&&!mudou._del&&mudou.data===date)list.push(mudou);
  var slots={};
  list.forEach(function(a){if(a.status==='cancelado'||a.status==='faltou')return;slotsDe(a).forEach(function(s){slots[s]=(slots[s]||0)+1})});
  await S.db.doc('ocupacao/'+date).set({data:date,slots:slots});
}
async function ajustarEstoque(id,delta){
  var ref=S.db.doc('produtos/'+id);var s=await ref.get();if(!s.exists)return;
  await ref.update({qtd:Math.max(0,(Number(s.data().qtd)||0)+delta)});
}

function idadeDe(n){var d=parseYmd(n),h=new Date();var m=(h.getFullYear()-d.getFullYear())*12+h.getMonth()-d.getMonth()-(h.getDate()<d.getDate()?1:0);if(!(m>=0))return '';return m<12?plural(m,'mês','meses'):plural(Math.floor(m/12),'ano','anos')}
async function carregaHist(id,mais){
  var hi=S.hist[id]||(S.hist[id]={ag:[],vd:[],meses:0});
  if(hi.carregando)return;hi.carregando=true;render();
  var base=ym(today()),de=hi.meses,ate=hi.meses+(mais||3),qs=[];
  try{
    if(de===0)qs.push(S.db.collection('agenda/'+addMonths(base,1)+'/itens').where('clienteId','==',id).get().then(function(s){hi.ag=hi.ag.concat(rows(s))}));
    for(var i=de;i<ate;i++){(function(m){
      qs.push(S.db.collection('agenda/'+m+'/itens').where('clienteId','==',id).get().then(function(s){hi.ag=hi.ag.concat(rows(s))}));
      qs.push(S.db.collection('caixa/'+m+'/vendas').where('clienteId','==',id).get().then(function(s){hi.vd=hi.vd.concat(rows(s))}));
    })(addMonths(base,-i))}
    await Promise.all(qs);hi.meses=ate;
  }catch(e){console.error(e);toast('Não foi possível carregar o histórico agora.')}
  hi.carregando=false;render();
}

function graficoMes(){
  var m=ym(S.caixaDia),p=m.split('-').map(Number),nd=new Date(p[0],p[1],0).getDate();
  var vs=(S.caixa[m]||[]).filter(function(v){return !v.cancelada}),tot=[],max=0;
  for(var d=1;d<=nd;d++){var k=m+'-'+pad(d);var t=sum(vs.filter(function(v){return v.data===k}),function(v){return v.total});tot.push(t);if(t>max)max=t}
  var total=sum(tot,function(x){return x}),n=vs.length;
  var h='<section class="sec"><div class="sec-h"><h2>Vendas por dia em '+esc(fmtMes(m))+'</h2><span class="muted small num">'+brl(total)+' · '+plural(n,'venda','vendas')+(n?' · ticket médio '+brl(Math.round(total/n)):'')+'</span></div>';
  if(!max)return h+'<div class="empty"><span>Sem vendas neste mês.</span></div></section>';
  h+='<div class="box"><div class="axis"><span>Maior dia: '+brl(max)+'</span></div><div class="bars" role="img" aria-label="Total vendido em cada dia do mês">'+tot.map(function(t,i){var k=m+'-'+pad(i+1);return '<div class="bar'+(t?'':' zero')+(k===S.caixaDia?' sel':'')+'" style="'+(t?'height:'+Math.max(3,Math.round(t/max*100))+'%':'')+'" title="'+pad(i+1)+'/'+pad(p[1])+': '+brl(t)+'"></div>'}).join('')+'</div><div class="axis"><span>1</span><span>'+Math.round(nd/2)+'</span><span>'+nd+'</span></div><p class="small muted">A barra em destaque é o dia selecionado no caixa.</p></div></section>';
  return h;
}
async function finalizarVenda(){
  var c=S.carrinho;if(!c.itens.length)return toast('Adicione ao menos um item.');
  var desc=parseBRL(c.descTxt);if(isNaN(desc))return toast('Desconto inválido. Use um valor em reais, como 5,00.');
  for(var i=0;i<c.itens.length;i++){var it=c.itens[i];if(it.tipo!=='produto')continue;var p=S.produtos.find(function(x){return x.id===it.id});
    if(!p)return toast(it.nome+' não está mais no cadastro. Remova do carrinho.');
    if(it.qtd>(Number(p.qtd)||0))return toast('Só há '+(Number(p.qtd)||0)+' de '+p.nome+' em estoque.')}
  var sb=subtotal();desc=Math.min(desc,sb);var total=sb-desc,agora=new Date(),data=today();
  await fazer(async function(){
    var ref=S.db.collection('caixa/'+ym(data)+'/vendas').doc();
    await ref.set({data:data,hora:pad(agora.getHours())+':'+pad(agora.getMinutes()),clienteId:c.clienteId||null,itens:c.itens.map(function(i){return {tipo:i.tipo,id:i.id,nome:i.nome,preco:i.preco,qtd:i.qtd}}),subtotal:sb,desconto:desc,total:total,pagamento:c.pagamento,cancelada:false,agendamentoId:c.agendamentoId||null,agMes:c.agMes||null,criadoEm:agora.toISOString()});
    for(var j=0;j<c.itens.length;j++)if(c.itens[j].tipo==='produto')await ajustarEstoque(c.itens[j].id,-c.itens[j].qtd);
    if(c.agendamentoId)await S.db.doc('agenda/'+c.agMes+'/itens/'+c.agendamentoId).update({vendaId:ref.id});
    S.carrinho=novoCarrinho();S.pdv={sel:'',qtd:'1'};S.caixaDia=data;ensureMonths();
  },'Venda registrada: '+brl(total)+' no '+PAG[c.pagamento]+'.');
}

/* ---------- Portal do cliente ---------- */
function slotsLivres(date,dur){
  var c=S.cfg;if(c.dias.indexOf(parseYmd(date).getDay())<0)return null;
  var oc=S.ocup[date]||{},n=Math.max(1,Math.ceil(dur/30)),out=[],corte=date===today()?nowMin():-1;
  for(var t=toMin(c.abre);t+n*30<=toMin(c.fecha);t+=30){if(t<=corte)continue;var ok=true;
    for(var i=0;i<n;i++)if((oc[fromMin(t+i*30)]||0)>=c.capacidade)ok=false;
    if(ok)out.push(fromMin(t))}
  return out;
}
function vPortal(){
  var c=S.cfg,sv=S.servicos.filter(function(s){return s.ativo!==false}).sort(byNome),hj=today();
  var h='';
  if(S.staff)h+='<div class="note plain">Prévia do que os clientes veem ao abrir esta página.</div>';
  h+='<div class="cols"><section class="sec"><div class="sec-h"><h2>Serviços e preços</h2></div>';
  h+=sv.length?'<div class="list">'+sv.map(function(s){return '<div class="row"><div class="main"><div class="t">'+esc(s.nome)+'</div><div class="s num">cerca de '+esc(s.duracao)+' min</div></div><strong class="num">'+brl(s.preco)+'</strong></div>'}).join('')+'</div>':'<div class="empty"><span>A loja ainda não publicou os serviços.</span></div>';
  h+='</section><section class="sec"><div class="sec-h"><h2>Fale com a loja</h2></div><div class="box" style="display:flex;flex-direction:column;gap:8px">'
    +(c.telefone?'<div class="fone" id="fone">'+esc(c.telefone)+'</div><div><button class="btn sm" data-a="copiarFone">Copiar telefone</button></div>':'<p class="muted">Telefone ainda não informado.</p>')
    +(c.endereco?'<p>'+esc(c.endereco)+'</p>':'')
    +'<p class="muted">'+esc(c.dias.slice().sort().map(function(d){return DIAS[d]}).join(', '))+' · '+esc(c.abre)+' às '+esc(c.fecha)+'</p></div></section></div>';
  var s=sv.find(function(x){return x.id===S.portal.servicoId})||sv[0];
  h+='<section class="sec"><div class="sec-h"><h2>Horários livres</h2></div>';
  if(!s)return h+'<div class="empty"><span>Os horários aparecem aqui quando a loja publicar os serviços.</span></div></section>';
  h+='<label class="field" style="max-width:360px">Para qual serviço?<select id="pt-serv" data-c="portalServ">'+sv.map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===s.id?' selected':'')+'>'+esc(x.nome)+' ('+esc(x.duracao)+' min)</option>'}).join('')+'</select></label>';
  h+='<div class="daysel">';
  for(var i=0;i<10;i++){var d=addDays(hj,i),dt=parseYmd(d),fechado=c.dias.indexOf(dt.getDay())<0;
    h+='<button class="day'+(d===S.portal.dia?' sel':'')+(d===hj?' hoje':'')+'" data-a="portalDia" data-d="'+d+'" aria-label="'+esc(fmtLongo(d))+'"><span class="w">'+DIAS[dt.getDay()]+'</span><span class="n">'+dt.getDate()+'</span><span class="c">'+(fechado?'fechado':fmtCurto(d))+'</span></button>'}
  h+='</div>';
  var livres=slotsLivres(S.portal.dia,s.duracao);
  if(livres===null)h+='<div class="empty"><span>A loja não abre neste dia.</span></div>';
  else if(!livres.length)h+='<div class="empty"><span>Sem horário livre para este serviço em '+esc(fmtLongo(S.portal.dia))+'. Tente outro dia.</span></div>';
  else h+='<p class="muted">'+esc(fmtLongo(S.portal.dia))+' — início disponível às:</p><div class="slots">'+livres.map(function(x){return '<div class="slot">'+x+'</div>'}).join('')+'</div>';
  h+='<p class="muted small">Para reservar, fale com a loja'+(c.telefone?' pelo '+esc(c.telefone):'')+' e diga o serviço e o horário. A reserva vale depois da confirmação da equipe.</p></section>';
  return h;
}

dlg.addEventListener('submit',async function(e){

function copiar(txt,okMsg){

/* ---------- início ---------- */
async function boot(){
  if(!window.claude||!window.claude.use){S.ready=true;S.semDb=true;return paint()}
  var r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  var db=r[0],user=r[1];S.db=db;
  if(!db){S.ready=true;S.semDb=true;return paint()}
  var staff=false;
  try{staff=user?!!(await user.canEdit()):false}catch(e){}
  if(!staff){try{staff=!!(await db.doc('interno/acesso').get()).exists}catch(e){}}
  S.staff=staff;
  sub('cfg',db.doc('config/loja'),function(s){var d=s.exists?s.data():{};S.cfg=Object.assign({},CFG0,d);if(!Array.isArray(S.cfg.dias)||!S.cfg.dias.length)S.cfg.dias=CFG0.dias.slice();S.cfg.capacidade=Math.max(1,Number(S.cfg.capacidade)||1);render()});
  sub('servicos',db.collection('servicos'),function(s){S.servicos=rows(s);render()});
  sub('ocup',db.collection('ocupacao').where('data','>=',today()).limit(90),function(s){var o={};s.docs.forEach(function(d){o[d.id]=(d.data()||{}).slots||{}});S.ocup=o;render()});
  if(staff){
    sub('clientes',db.collection('clientes'),function(s){S.clientes=rows(s);render()});
    sub('pets',db.collection('pets'),function(s){S.pets=rows(s);render()});
    sub('produtos',db.collection('produtos'),function(s){S.produtos=rows(s);render()});
    ensureMonths();
  }
  S.ready=true;render();
}
boot().catch(function(e){console.error(e);S.ready=true;S.semDb=true;paint()});
})();
